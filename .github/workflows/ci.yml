# CI quality gate (Vol 9 §CI/CD, Vol 10 §gates).
# Nothing merges unless the prototype typechecks + its simulation smoke-checks pass,
# and the platform libraries build, typecheck, and pass their tests.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  prototype:
    name: Prototype (root Expo app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Engine smoke checks
        run: npm run smoke

  platform:
    name: Platform monorepo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build libraries
        run: npm run build:libs
      - name: Typecheck workspaces
        run: npm run typecheck
      - name: Test (shared + services)
        run: npm test
      - name: Build service servers (full typecheck of infra/server)
        run: |
          npm run -w @diabetes-quest/backend build:full
          npm run -w @diabetes-quest/device-gateway build:full
          npm run -w @diabetes-quest/ai-coach build:full
      - name: Device-gateway integration (forwarding)
        run: npm run -w @diabetes-quest/device-gateway test:integration

  backend-integration:
    name: Backend integration (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/dq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build libraries
        run: npm run build:libs
      - name: Build backend (full) + run migrations
        run: |
          npm run -w @diabetes-quest/backend build:full
          npm run -w @diabetes-quest/backend migrate
      - name: Integration tests
        run: npm run -w @diabetes-quest/backend test:integration
