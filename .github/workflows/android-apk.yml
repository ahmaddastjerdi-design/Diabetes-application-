# Builds a self-contained, installable Android APK on GitHub's servers and uploads it
# as a downloadable artifact — no local Android tooling or Expo account required.
# Run it from the Actions tab ("Build Android APK" → Run workflow), or it runs on push.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["claude/apk-build-setup"]

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"
          CI: "1"

      - name: Build release APK (JS bundled, debug-signed for testing)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-quest-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
