name: Build Android APK

# Builds an installable APK in the cloud and publishes it to a GitHub Release
# so it can be downloaded straight to a phone — no local toolchain needed.

on:
  workflow_dispatch: {}
  push:
    branches: ["claude/react-native-patient-gamification-g6vg5d"]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/diabetes-quest.apk

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-quest-apk
          path: out/diabetes-quest.apk

      - name: Publish to a downloadable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Diabetes Quest — latest APK
          body: |
            Install on Android: download **diabetes-quest.apk** below, open it,
            and tap Install (allow "install from unknown sources" if prompted).
            Educational only — not medical advice.
          files: out/diabetes-quest.apk
