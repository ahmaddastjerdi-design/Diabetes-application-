name: HealthPassport Pro CI

on:
  push:
    branches: ['**']
    paths:
      - 'healthpassport/**'
      - '.github/workflows/healthpassport-ci.yml'
  pull_request:
    paths:
      - 'healthpassport/**'
      - '.github/workflows/healthpassport-ci.yml'

defaults:
  run:
    working-directory: healthpassport

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: healthpassport/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build (PWA)
        run: npm run build
