<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HealthPassport Pro">
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so the icon survives maskable safe-zone cropping -->
  <rect width="512" height="512" fill="url(#bgm)"/>
  <!-- Content kept within the ~80% safe zone -->
  <rect x="240" y="156" width="32" height="200" rx="10" fill="#ffffff"/>
  <rect x="156" y="240" width="200" height="32" rx="10" fill="#ffffff"/>
</svg>
