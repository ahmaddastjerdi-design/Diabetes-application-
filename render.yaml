# Render Blueprint — one-click public deploy of HealthPassport Pro.
#
# How to use:
#   1. Push this repo to your GitHub account (or fork it).
#   2. On https://render.com → New → Blueprint → pick this repo.
#   3. Render reads this file, provisions a PostgreSQL database and a web
#      service, builds the Docker image, runs migrations, seeds a synthetic
#      demo patient, and gives you a public https URL.
#   4. Sign in at that URL with:  demo@healthpassport.local / Demo!12345
#
# Free tiers are fine for a demo (the web service sleeps when idle; the free
# database expires after ~90 days). For real use, upgrade the plans and set
# SEED_DEMO=false. Uploaded documents are stored on the container filesystem,
# which is ephemeral on the free plan — attach a disk or S3-compatible storage
# (STORAGE_* env vars) to persist them.

databases:
  - name: healthpassport-db
    databaseName: healthpassport
    user: healthpassport
    plan: free

services:
  - type: web
    name: healthpassport-pro
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthpassport-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: healthpassport-db
          property: connectionString
      # Generated once and kept stable by Render (signs session cookies).
      - key: AUTH_SECRET
        generateValue: true
      # Trust the Render proxy's forwarded host so Auth.js builds correct URLs.
      - key: AUTH_TRUST_HOST
        value: 'true'
      # Seed the synthetic demo patient on first boot. Set to false for empty.
      - key: SEED_DEMO
        value: 'true'
      - key: NODE_ENV
        value: production
